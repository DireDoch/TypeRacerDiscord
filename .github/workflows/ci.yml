# CI : tests + builds des deux moitiés, en parallèle, sur push et PR vers main/develop.
# Le build Vite attrape les erreurs TypeScript hors des fichiers testés par vitest.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: rustup component add clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  # --- Release (issue #117) ---------------------------------------------------
  # Publie une release GitHub quand la version de backend/Cargo.toml n'en a pas encore.
  #
  # `main` bouge pour DEUX raisons (Docs/agents/git-workflow.md) : de vraies releases,
  # mais aussi des merges de section et des pushs de docs. Sur ces derniers la version
  # n'a pas changé — le job sort alors en silence et la CI reste verte. Les faire
  # échouer en rouge entraînerait à ignorer la CI.
  #
  # La garde lit le MANIFESTE, pas un tag : pousser une branche et pousser un tag sont
  # deux événements GitHub distincts, sans ordre garanti entre eux. Une garde « un tag
  # pointe sur ce commit » raterait la release une fois sur deux, silencieusement.
  #
  # `needs:` ne fonctionne qu'à l'intérieur d'un même workflow : c'est la raison pour
  # laquelle ce job vit ici et non dans un release.yml séparé. Publier devient
  # mécaniquement impossible tant qu'un test échoue, sans rejouer les tests deux fois.
  release:
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # poser le tag et créer la release
    # Le build musl à froid dure plusieurs minutes. Sans ce verrou, un second push sur
    # main pendant ce temps (merge de section, push de docs) relance un job dont la garde
    # voit encore la release absente : les deux rebuildent et courent au même
    # `gh release create`, le perdant échoue en rouge sur un push sans rapport.
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Faut-il publier ?
        id: gate
        run: |
          set -euo pipefail
          # Les dépendances déclarent `version` en ligne (`{ version = "0.7" }`), jamais
          # en début de ligne : l'ancrage `^` suffit à ne cueillir que celle du paquet.
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::version introuvable dans backend/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # On LISTE les tags plutôt que d'interroger `gh release view v$version` : ce
          # dernier renvoie un code non nul aussi bien pour un 404 que pour une panne
          # réseau, un quota ou un souci d'auth — la garde basculerait alors sur
          # « publier » et brûlerait un build complet avant de mourir sur « already
          # exists ». Ici une erreur d'API fait échouer le job (set -e), honnêtement.
          # L'appel est SORTI de la condition : dans un `if`, `set -e` est suspendu, et
          # un `gh` en échec y serait lu comme « pas de release » → publication.
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                   --json tagName --jq '.[].tagName')
          if printf '%s\n' "$tags" | grep -qxF "v$version"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "\`v$version\` est déjà publiée — rien à faire." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publication de **v$version**." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Les notes viennent du dépôt, pas des titres de commits : une release parle au
      # joueur. Section absente ou vide → on échoue, bruyamment et avant tout build.
      - name: Notes depuis CHANGELOG.md
        if: steps.gate.outputs.publish == 'true'
        id: notes
        run: |
          set -euo pipefail
          tag="v${{ steps.gate.outputs.version }}"
          awk -v t="$tag" '$1=="##" && $2==t {f=1; next} $1=="##" {f=0} f' \
            CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md n'a pas de section « ## $tag » (ou elle est vide). Écrire les notes est la condition pour publier."
            exit 1
          fi
          # Le titre de la release est la ligne de titre du CHANGELOG, sans les `## `.
          title=$(awk -v t="$tag" '$1=="##" && $2==t {sub(/^## /, ""); print; exit}' CHANGELOG.md)
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Vite fige `import.meta.env.VITE_*` À LA COMPILATION. Sans cette variable, le
      # bundle publié part en MODE DEV (discord.ts : `if (!clientId || …)`) : aucun
      # handshake Embedded App SDK et tous les joueurs deviennent `dev-player-1`.
      # L'archive serait inutilisable comme Activity, et le déployeur ne pourrait rien y
      # faire — la valeur est compilée dedans. `.env` étant gitignoré, la CI ne l'a pas :
      # elle vient d'une variable de dépôt. Le client id est PUBLIC (il est déjà en clair
      # dans frontend/.env.example) — ce n'est pas un secret, seul le client_secret en est
      # un et il reste côté backend.
      - name: Le client id Discord est-il configuré ?
        if: steps.gate.outputs.publish == 'true'
        env:
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
        run: |
          if [ -z "${VITE_DISCORD_CLIENT_ID:-}" ]; then
            echo "::error::Variable de dépôt VITE_DISCORD_CLIENT_ID absente. Le bundle partirait en mode dev (tous les joueurs = dev-player-1) et l'archive serait inutilisable comme Activity. Corriger avec : gh variable set VITE_DISCORD_CLIENT_ID --body <client id>"
            exit 1
          fi

      - name: Build du frontend
        if: steps.gate.outputs.publish == 'true'
        working-directory: frontend
        env:
          VITE_DISCORD_CLIENT_ID: ${{ vars.VITE_DISCORD_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      # Cible musl = binaire ENTIÈREMENT statique. Compilé sur ubuntu-latest, un binaire
      # glibc exigerait la glibc de cette image (2.39) et refuserait de démarrer sur un
      # Debian 12 (2.36) ou un Ubuntu 22.04 (2.35) — panne visible seulement au
      # déploiement. Le projet peut se le permettre : rustls plutôt qu'OpenSSL, et SQLite
      # compilé en dur par libsqlite3-sys, donc aucune dépendance C système.
      # `musl-tools` fournit musl-gcc, dont libsqlite3-sys a besoin pour compiler SQLite.
      - name: Toolchain musl
        if: steps.gate.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.publish == 'true'
        with:
          workspaces: backend
          key: musl

      - name: Build du backend (statique)
        if: steps.gate.outputs.publish == 'true'
        working-directory: backend
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      # Les migrations sont EMBARQUÉES dans le binaire (`sqlx::migrate!` les inclut à la
      # compilation) : rien à copier. Le backend cherche en revanche le frontend via
      # STATIC_DIR, d'où le rappel dans DEPLOY.md.
      - name: Empaquetage
        if: steps.gate.outputs.publish == 'true'
        id: pack
        run: |
          set -euo pipefail
          name="typeracer-discord-v${{ steps.gate.outputs.version }}-linux-x86_64"
          mkdir "$name"
          cp backend/target/x86_64-unknown-linux-musl/release/typeracer-discord-backend "$name/"
          cp -r frontend/dist "$name/dist"
          cat > "$name/DEPLOY.md" <<'DEPLOY'
          # Déployer

          Binaire statique : aucun toolchain Rust ni Node requis, aucune bibliothèque
          système. N'importe quel Linux x86_64 suffit.

          ```sh
          STATIC_DIR=./dist ./typeracer-discord-backend
          ```

          ## Il écoute sur la LOOPBACK, pas sur le réseau

          L'adresse est `127.0.0.1:8080` (`PORT` change le port, **pas** l'adresse) :
          le serveur est injoignable depuis une autre machine, volontairement. C'est ce
          que veut le mode de déploiement du projet — un tunnel qui tourne sur le même
          hôte et se connecte en local :

          ```sh
          cloudflared tunnel --url http://localhost:8080
          ```

          Puis l'URL du tunnel va dans **Discord → Activities → URL Mappings**. Pour
          exposer directement sur Internet, mettez un reverse proxy devant (nginx,
          Caddy) — le binaire ne s'en chargera pas.

          ## Variables d'environnement

          À passer dans l'environnement ou dans un `.env` à côté du binaire.

          | Variable | Sans elle |
          | --- | --- |
          | `DISCORD_CLIENT_ID` | Mode dev : le Bearer sert de player_id, `POST /token` renvoie 503 |
          | `DISCORD_CLIENT_SECRET` | idem — les deux vont ensemble |
          | `APININJAS_API_KEY` | `GET /api/quote` renvoie 502 : **les courses en Citation échouent** |
          | `STATIC_DIR` | Cherche `../frontend/dist` — à mettre à `./dist` ici |
          | `DATABASE_URL` | Défaut `sqlite:typeracer.db` dans le dossier courant |
          | `PORT` | Défaut 8080 |

          Le client id Discord du frontend est déjà compilé dans `dist/` — il n'est pas
          à fournir ici.

          La base SQLite est créée au premier démarrage ; les migrations sont incluses
          dans le binaire, il n'y a rien à appliquer à la main.
          DEPLOY
          tar -czf "$name.tar.gz" "$name"
          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"

      # `gh release create` pose le tag lui-même sur ce commit : aucun `git tag` séparé,
      # donc aucune fenêtre où le tag existerait sans sa release. Une version en `0.` est
      # publiée en pre-release — le projet n'est pas déclaré stable avant `1.0.0`.
      # Le titre passe par `env:`, jamais par `${{ }}` dans la commande : Actions
      # interpole AVANT que le shell ne lise la ligne, donc un backquote ou un `$(…)`
      # dans un titre de CHANGELOG s'exécuterait. Ce n'est pas théorique ici — le
      # CHANGELOG donne lui-même en exemple un titre contenant un identifiant entre
      # backquotes.
      - name: Publication
        if: steps.gate.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          TITLE: ${{ steps.notes.outputs.title }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            0.*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            $prerelease \
            "$ASSET"
          echo "Publiée : $TITLE" >> "$GITHUB_STEP_SUMMARY"
